<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1513">
<title>Dart Licznik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">

  <!-- 1. USTAWIENIA GRY -->
  <section id="scr-setup" class="screen">
    <header class="top"><h1>🎯 Dart Licznik</h1><span class="muted small">działa offline</span></header>
    <div class="card">
      <h2>Gracze</h2>
      <div id="players"></div>
      <button class="btn ghost" id="add-player">+ Dodaj gracza</button>
    </div>
    <div class="card">
      <h2>Gra</h2>
      <div class="seg" id="game-kind">
        <button data-k="x01" class="on">301 / 501</button>
        <button data-k="cricket">Cricket</button>
        <button data-k="atc">Po kolei</button>
        <button data-k="shanghai">Shanghai</button>
        <button data-k="high">High Score</button>
      </div>
      <div id="opts-x01" class="opts">
        <label>Start <select id="o-start"><option>301</option><option selected>501</option><option>701</option></select></label>
        <label>Legi do wygrania <select id="o-legs"></select></label>
        <label>Sety do wygrania <select id="o-sets"></select></label>
        <label class="chk"><input type="checkbox" id="o-dout" checked> Double out (kończ na podwójnym)</label>
        <label class="chk"><input type="checkbox" id="o-din"> Double in (zacznij od podwójnego)</label>
      </div>
      <div id="opts-atc" class="opts" hidden>
        <label class="chk"><input type="checkbox" id="o-skip"> Podwójne/potrójne przeskakują o 2/3 pola</label>
      </div>
      <div id="opts-shanghai" class="opts" hidden>
        <label>Liczba rund <select id="o-sh-rounds"><option>7</option><option>10</option><option>20</option></select></label>
      </div>
      <div id="opts-high" class="opts" hidden>
        <label>Liczba rund <select id="o-hi-rounds"><option>5</option><option selected>10</option><option>20</option></select></label>
      </div>
      <div id="opts-cricket" class="opts" hidden><p class="muted small">Pola 15–20 i bull. Zamknij wszystkie i miej co najmniej tyle punktów, co rywale.</p></div>
    </div>
    <div class="row">
      <button class="btn primary" id="go-camera">Dalej: kamera →</button>
      <button class="btn ghost" id="go-manual">Graj bez kamery</button>
    </div>
  </section>

  <!-- 2. KAMERA I KALIBRACJA -->
  <section id="scr-camera" class="screen" hidden>
    <div class="stage" id="cal-stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="cal-bar">
      <p id="cal-msg">Uruchamiam kamerę…</p>
      <div class="row wrap">
        <button class="btn ghost" id="cal-reset">Kalibruj od nowa</button>
        <label class="btn ghost file">Nagranie testowe<input type="file" id="cal-file" accept="video/*" hidden></label>
        <button class="btn ghost" id="cal-back">← Wróć</button>
        <button class="btn primary" id="cal-ok" disabled>Start gry</button>
      </div>
    </div>
  </section>

  <!-- 3. GRA -->
  <section id="scr-play" class="screen" hidden>
    <header class="top"><div><h2 id="g-title"></h2><span id="g-header" class="muted small"></span></div>
      <button class="icon" id="g-menu" aria-label="Menu">⋯</button></header>
    <div class="play-grid">
      <div class="stage small" id="play-stage"><canvas id="play-canvas"></canvas><span id="cam-state" class="pill">Kamera</span></div>
      <div id="board-view" class="scores"></div>
    </div>
    <div class="turn">
      <div class="turn-slots" id="slots"></div>
      <div id="status" class="status">Rzucaj!</div>
    </div>
    <div class="row wrap actions">
      <button class="btn" id="a-manual">✍ Wpisz ręcznie</button>
      <button class="btn" id="a-miss">Pudło</button>
      <button class="btn" id="a-undo">↶ Cofnij</button>
      <button class="btn primary" id="a-next">Następny gracz →</button>
    </div>
  </section>

  <!-- tarcza do ręcznego wpisywania / korekty -->
  <dialog id="dlg-board">
    <div class="dlg-head"><strong id="dlg-title">Dotknij miejsce trafienia</strong><button class="icon" data-close aria-label="Zamknij">✕</button></div>
    <div id="dlg-svg"></div>
    <div class="row wrap quick">
      <button class="btn" data-q="0">Pudło</button><button class="btn" data-q="25">25</button><button class="btn" data-q="BULL">Bull</button>
    </div>
  </dialog>

  <dialog id="dlg-menu">
    <div class="dlg-head"><strong>Menu</strong><button class="icon" data-close aria-label="Zamknij">✕</button></div>
    <div class="menu-list">
      <button class="btn" id="m-recal">Kalibruj kamerę</button>
      <button class="btn" id="m-reset">Tarcza pusta – zapamiętaj tło</button>
      <label class="chk"><input type="checkbox" id="m-voice" checked> Czytaj wyniki na głos</label>
      <label>Czułość wykrywania <input type="range" id="m-sens" min="12" max="50" value="28"></label>
      <button class="btn" id="m-new">Nowa gra</button>
    </div>
  </dialog>

  <dialog id="dlg-end">
    <h2 id="end-title"></h2>
    <div id="end-table"></div>
    <div class="row"><button class="btn primary" id="end-again">Rewanż</button><button class="btn ghost" id="end-new">Nowa gra</button></div>
  </dialog>
</main>
<script src="board.js"></script>
<script src="vision.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body>
</html>
