<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101614">
<title>Dart Licznik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">

  <!-- START -->
  <section id="scr-home" class="screen home">
    <header class="bar">
      <span class="brand"><img src="icon-192.png" alt="" width="34" height="34"> <span data-i18n="appName">Dart Licznik</span></span>
      <button class="icon-btn" data-settings data-i18n-aria="settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.650a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.690-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg></button>
    </header>
    <div class="hero">
      <div class="hero-board" aria-hidden="true"></div>
      <h1 data-i18n="heroTitle"></h1>
      <p class="muted" data-i18n="heroSub"></p>
    </div>
    <div class="home-actions">
      <button class="btn primary xl" id="home-new" data-i18n="newGame"></button>
      <button class="btn xl ghost" id="home-again" hidden></button>
      <div class="or"><span data-i18n="or"></span></div>
      <button class="tile" id="home-saved" hidden>
        <span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 2v4h8V5H7zm5 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span>
        <span class="tile-txt"><b data-i18n="savedTile"></b><small id="home-saved-sub"></small></span>
        <svg class="tile-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tile" id="home-remote">
        <span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h7a2 2 0 0 1 2 2v3h-2V4H7v16h7v-3h2v3a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm11.5 6.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM9.5 17h2v1.5h-2z"/></svg></span>
        <span class="tile-txt"><b data-i18n="remoteTile"></b><small id="home-remote-sub" data-i18n="remoteTileSub"></small></span>
        <svg class="tile-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- KREATOR NOWEJ GRY -->
  <section id="scr-new" class="screen">
    <header class="bar">
      <button class="icon-btn" id="w-back" data-i18n-aria="back">←</button>
      <div class="steps" id="w-steps"><span></span><span></span><span></span></div>
      <button class="icon-btn" data-settings data-i18n-aria="settings">⚙</button>
    </header>

    <div class="step" data-step="0">
      <h2 class="step-title" data-i18n="chooseGame"></h2>
      <div class="games" id="game-cards">
        <button data-k="x01" data-start="501"><b>501</b><small data-i18n="g501sub"></small></button>
        <button data-k="x01" data-start="301"><b>301</b><small data-i18n="g301sub"></small></button>
        <button data-k="cricket"><b>Cricket</b><small data-i18n="gCricketSub"></small></button>
        <button data-k="atc"><b data-i18n="gAtc"></b><small data-i18n="gAtcSub"></small></button>
        <button data-k="shanghai"><b>Shanghai</b><small data-i18n="gShSub"></small></button>
        <button data-k="high"><b>High Score</b><small data-i18n="gHiSub"></small></button>
      </div>
      <div class="card opts" id="opts-x01">
        <div class="opt-row"><span data-i18n="start"></span><div class="seg small" id="o-start"><button data-v="301">301</button><button data-v="501">501</button><button data-v="701">701</button></div></div>
        <div class="opt-row"><span data-i18n="legsToWin"></span><div class="stepper" data-id="legs" data-min="1" data-max="11"><button>−</button><output>1</output><button>+</button></div></div>
        <div class="opt-row"><span data-i18n="setsToWin"></span><div class="stepper" data-id="sets" data-min="1" data-max="7"><button>−</button><output>1</output><button>+</button></div></div>
        <label class="opt-row"><span>Double out <small class="muted" data-i18n="doubleOutSub"></small></span><input type="checkbox" class="switch" id="o-dout" checked></label>
        <label class="opt-row"><span>Double in <small class="muted" data-i18n="doubleInSub"></small></span><input type="checkbox" class="switch" id="o-din"></label>
      </div>
      <div class="card opts" id="opts-atc" hidden>
        <label class="opt-row"><span><span data-i18n="atcSkip"></span> <small class="muted" data-i18n="atcSkipSub"></small></span><input type="checkbox" class="switch" id="o-skip"></label>
      </div>
      <div class="card opts" id="opts-shanghai" hidden>
        <div class="opt-row"><span data-i18n="rounds"></span><div class="seg small" id="o-sh-rounds"><button data-v="7">7</button><button data-v="10">10</button><button data-v="20">20</button></div></div>
      </div>
      <div class="card opts" id="opts-high" hidden>
        <div class="opt-row"><span data-i18n="rounds"></span><div class="seg small" id="o-hi-rounds"><button data-v="5">5</button><button data-v="10">10</button><button data-v="20">20</button></div></div>
      </div>
      <div class="card opts" id="opts-cricket" hidden><p class="muted small" data-i18n="cricketInfo"></p></div>
    </div>

    <div class="step" data-step="1" hidden>
      <h2 class="step-title" data-i18n="whoPlays"></h2>
      <div id="players" class="players"></div>
      <button class="btn ghost" id="add-player" data-i18n="addPlayer"></button>
      <div id="recent" class="chips"></div>
    </div>

    <div class="step" data-step="2" hidden>
      <h2 class="step-title" data-i18n="cameras"></h2>
      <div class="choices" id="cam-choice">
        <button data-c="one"><span class="ico">📱</span><b data-i18n="cam1"></b><small data-i18n="cam1sub"></small></button>
        <button data-c="two"><span class="ico">📱📱</span><b data-i18n="cam2"></b><small data-i18n="cam2sub"></small></button>
        <button data-c="none"><span class="ico">⌨</span><b data-i18n="cam0"></b><small data-i18n="cam0sub"></small></button>
      </div>
      <div class="card" id="two-panel" hidden>
        <p class="small muted" data-i18n="twoInfo"></p>
        <button class="btn" id="pair-host"></button>
        <p id="pair-state" class="small muted"></p>
      </div>
    </div>

    <footer class="wizard-foot">
      <button class="btn primary xl" id="w-next"></button>
    </footer>
  </section>

  <!-- KALIBRACJA -->
  <section id="scr-camera" class="screen">
    <header class="bar">
      <button class="icon-btn" id="cal-back" data-i18n-aria="back">←</button>
      <strong data-i18n="calib"></strong>
      <button class="icon-btn" data-settings data-i18n-aria="settings">⚙</button>
    </header>
    <div class="stage" id="cal-stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <p id="cal-msg" class="cal-msg"></p>
    <div class="row">
      <button class="btn ghost" id="cal-auto" data-i18n="calAuto"></button>
      <button class="btn ghost" id="cal-rot" data-i18n-aria="calRotate" hidden>↻</button>
      <button class="btn ghost" id="cal-reset" data-i18n="calReset"></button>
      <button class="btn primary grow" id="cal-ok" disabled></button>
    </div>
  </section>

  <!-- GRA -->
  <section id="scr-play" class="screen">
    <header class="bar">
      <button class="icon-btn" id="g-menu" data-i18n-aria="menuGame">⋯</button>
      <div class="bar-title"><strong id="g-title"></strong><span id="g-header" class="muted small"></span></div>
      <button class="icon-btn" data-settings data-i18n-aria="settings">⚙</button>
    </header>
    <div class="play-main">
      <div class="stage fill" id="play-stage"><canvas id="play-canvas"></canvas><span id="cam-state" class="pill" data-i18n="camera"></span><span id="g-pair" class="pill right"></span><span id="cam-lock" class="pill lock"></span></div>
      <div class="play-side">
        <div id="board-view" class="scores"></div>
        <div class="history"><div class="h-head" data-i18n="history"></div><div id="history" class="h-list"></div></div>
      </div>
    </div>
    <div class="turn">
      <div class="turn-slots" id="slots"></div>
      <div id="status" class="status"></div>
    </div>
    <div class="keypad" id="kp-inline" hidden></div>
    <div class="actions">
      <button class="btn" id="a-manual" data-i18n="aManual"></button>
      <button class="btn" id="a-miss" data-i18n="aMiss"></button>
      <button class="btn" id="a-undo" data-i18n="aUndo"></button>
      <button class="btn primary" id="a-next" data-i18n="aNext"></button>
    </div>
  </section>

  <!-- DRUGA KAMERA -->
  <section id="scr-remote" class="screen">
    <header class="bar">
      <span class="brand" data-i18n="remoteTitle"></span>
      <span id="r-conn" class="pill static ok"></span>
      <button class="icon-btn" data-settings data-i18n-aria="settings">⚙</button>
    </header>
    <div class="stage fill" id="remote-stage"><canvas id="remote-canvas"></canvas><span id="r-cam" class="pill" data-i18n="camera"></span><span id="r-lock" class="pill lock"></span></div>
    <div id="r-status" class="status" data-i18n="remoteSending"></div>
    <div id="r-board" class="scores"></div>
    <div class="row">
      <button class="btn grow" id="r-recal" data-i18n="recal"></button>
      <button class="btn ghost" id="r-leave" data-i18n="leave"></button>
    </div>
  </section>

  <!-- USTAWIENIA (tylko pod ikoną ⚙) -->
  <dialog id="dlg-settings" class="sheet">
    <div class="dlg-head"><strong data-i18n="settings"></strong><button class="icon-btn" data-close data-i18n-aria="close">✕</button></div>
    <div class="set-list">
      <div class="opt-row"><span data-i18n="sLang"></span><div class="seg" id="s-lang"><button data-v="pl">PL</button><button data-v="en">EN</button></div></div>
      <label class="opt-row"><span data-i18n="sVoice"></span><input type="checkbox" class="switch" id="s-voice"></label>
      <div class="opt-row" id="s-caller-row"><span data-i18n="sCaller"></span>
        <span class="caller-pick"><select id="s-caller"></select><button class="icon-btn play" id="s-test" data-i18n-aria="sTest">▶</button></span></div>
      <p class="small muted voice-hint" id="s-voice-hint" data-i18n="sVoiceHint" hidden></p>
      <label class="opt-row"><span data-i18n="sCrowd"></span><input type="checkbox" class="switch" id="s-crowd"></label>
      <div class="opt-row"><span data-i18n="sEach"></span><div class="seg" id="s-each"><button data-v="pts" data-i18n="eachPts"></button><button data-v="field" data-i18n="eachField"></button><button data-v="off" data-i18n="eachOff"></button></div></div>
      <label class="opt-row"><span data-i18n="sLock"></span><input type="checkbox" class="switch" id="s-lock"></label>
      <div class="opt-row col"><span><span data-i18n="sSens"></span> <small class="muted" id="s-sens-v"></small></span><input type="range" id="s-sens" min="20" max="62"></div>
      <button class="btn ghost" id="s-bg" data-i18n="sBg"></button>
      <details class="help"><summary data-i18n="sHelp"></summary><p data-i18n="sHelpTxt"></p></details>
      <div class="set-foot"><button class="btn ghost danger" id="s-reset" data-i18n="sReset"></button>
      <p class="muted small"><span class="ver"></span> · <span data-i18n="offline"></span></p></div>
    </div>
  </dialog>

  <dialog id="dlg-menu" class="sheet">
    <div class="dlg-head"><strong data-i18n="menuGame"></strong><button class="icon-btn" data-close data-i18n-aria="close">✕</button></div>
    <div class="set-list">
      <button class="btn primary" id="m-save" data-i18n="mSave"></button>
      <button class="btn" id="m-recal" data-i18n="mRecal"></button>
      <button class="btn" id="m-restart" data-i18n="mRestart"></button>
      <button class="btn danger" id="m-end" data-i18n="mEnd"></button>
    </div>
  </dialog>

  <dialog id="dlg-saved" class="sheet">
    <div class="dlg-head"><strong data-i18n="savedTitle"></strong><button class="icon-btn" data-close data-i18n-aria="close">✕</button></div>
    <div id="saved-list" class="saved-list"></div>
  </dialog>

  <dialog id="dlg-board" class="sheet">
    <div class="dlg-head"><strong id="dlg-title"></strong><button class="icon-btn" data-close data-i18n-aria="close">✕</button></div>
    <div class="keypad" id="kp-dlg"></div>
  </dialog>

  <dialog id="dlg-pair" class="sheet">
    <div class="dlg-head"><strong id="pair-title" data-i18n="pairing"></strong><button class="icon-btn" id="pair-cancel" data-i18n-aria="close">✕</button></div>
    <p id="pair-step" class="pair-step"></p>
    <canvas id="pair-qr" class="pair-qr" hidden></canvas>
    <video id="pair-video" class="pair-video" playsinline muted hidden></video>
    <div id="pair-manual" hidden>
      <textarea id="pair-text" rows="3" data-i18n-ph="pairPaste"></textarea>
      <button class="btn" id="pair-text-ok" data-i18n="pairUse"></button>
    </div>
    <button class="btn primary" id="pair-scan" hidden data-i18n="pairScanBtn"></button>
  </dialog>

  <dialog id="dlg-end" class="sheet">
    <h2 id="end-title" class="center"></h2>
    <div id="end-table"></div>
    <div class="row"><button class="btn primary grow" id="end-again" data-i18n="rematch"></button><button class="btn ghost" id="end-new" data-i18n="newGame"></button></div>
  </dialog>
</main>
<script src="i18n.js"></script>
<script src="board.js"></script>
<script src="vision.js"></script>
<script src="autocal.js"></script>
<script src="games.js"></script>
<script src="caller.js"></script>
<script src="qr.js"></script>
<script src="pair.js"></script>
<script src="app.js"></script>
</body>
</html>
